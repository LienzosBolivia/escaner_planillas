<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel IA - Pruebas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex justify-center items-center min-h-screen">

    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">⚡ Laboratorio de IA</h1>
        
        <input type="file" id="archivo" accept="image/*" class="w-full mb-4 p-2 bg-gray-700 rounded cursor-pointer">
        
        <!-- Selector de comandos original -->
        <select id="comando" class="w-full mb-4 p-3 bg-gray-700 rounded font-semibold text-white">
            <option value="proceso_completo">🏭 Proceso Completo (Full)</option>
            <option value="solo_encuadre">🎯 Solo Encuadre</option>
            <option value="solo_mejorar">✨ Solo Restaurar Rostros</option>
            <option value="solo_recortar">✂️ Solo Recortar Fondo</option>
        </select>
        
        <!-- 👇 NUEVO: Selector de Fondos -->
        <div class="mb-4 bg-gray-700 p-3 rounded">
            <label class="block text-sm font-bold text-gray-300 mb-2">Fondo para la foto:</label>
            <select id="fondoIA" class="w-full p-2 bg-gray-600 rounded text-white cursor-pointer">
                <option value="0">PNG Transparente (Sin fondo)</option>
                <option value="1">Fondo 1 (Ej: Paisaje)</option>
                <option value="2">Fondo 2 (Ej: Estudio Azul)</option>
                <option value="3">Fondo 3 (Ej: Oficina)</option>
            </select>
            <p class="text-xs text-gray-400 mt-1">Solo aplica si eliges "Proceso Completo".</p>
        </div>
        
        <div class="mb-6 bg-gray-700 p-3 rounded">
            <label class="block text-sm font-bold text-gray-300 mb-2">
                Fidelidad al rostro original: <span id="valorFidelidad" class="text-blue-400">0.7 (Recomendado)</span>
            </label>
            <input type="range" id="fidelidadIA" min="0.1" max="1.0" step="0.1" value="0.7" class="w-full cursor-pointer">
            <p class="text-xs text-gray-400 mt-1">0.1 = IA inventa mucho | 1.0 = IA no cambia rasgos (Mantiene color de ojos)</p>
        </div>

        <button id="btnEnviar" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded transition-colors">
            Enviar a Kaggle
        </button>

        <div id="estado" class="mt-4 text-center font-bold text-yellow-400 hidden">Iniciando...</div>
        <img id="resultadoImg" class="mt-6 w-full rounded-lg shadow-lg hidden" src="" alt="Resultado">
    </div>

    <!-- Scripts de Firebase y Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDP1vPBXFQkvzx1YIbTCziOzXDRxQ6a_kM",
            authDomain: "botartes.firebaseapp.com",
            projectId: "botartes",
            messagingSenderId: "513493472800",
            appId: "1:513493472800:web:55b4aed3c9ae1435aa0e45"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Llave de ImgBB
        const API_KEY_IMGBB = "3af64fc1fb954aac84a218bc2b3450c0";

        // Captura de elementos del HTML
        const btnEnviar = document.getElementById("btnEnviar");
        const inputArchivo = document.getElementById("archivo");
        const selectComando = document.getElementById("comando");
        const txtEstado = document.getElementById("estado");
        const imgResultado = document.getElementById("resultadoImg");
        const sliderFidelidad = document.getElementById("fidelidadIA");
        const textoFidelidad = document.getElementById("valorFidelidad");

        // Lógica visual: Cambiar el numerito azul cuando mueves la barrita
        sliderFidelidad.addEventListener("input", function() {
            let texto = this.value;
            if (this.value === "0.7") texto += " (Recomendado)";
            textoFidelidad.innerText = texto;
        });

        // Lógica de envío
        btnEnviar.addEventListener("click", async () => {
            const archivo = inputArchivo.files[0];
            if (!archivo) return alert("Sube una imagen primero");

            btnEnviar.disabled = true;
            btnEnviar.classList.replace("bg-blue-600", "bg-gray-600");
            txtEstado.classList.remove("hidden");
            txtEstado.innerText = "1/3 Subiendo imagen a ImgBB...";
            imgResultado.classList.add("hidden");

            try {
                // 1. Subir imagen a ImgBB
                const formData = new FormData();
                formData.append("image", archivo);

                const resImgbb = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY_IMGBB}`, {
                    method: "POST",
                    body: formData
                });
                const dataImgbb = await resImgbb.json();
                
                if (!dataImgbb.success) throw new Error("Falló la subida a ImgBB");
                const urlOriginal = dataImgbb.data.url;

                // 2. Crear tarea en Firestore
                txtEstado.innerText = "2/3 Kaggle está procesando...";
                
                const comando = selectComando.value;
                const nivelFidelidad = parseFloat(sliderFidelidad.value);
                const fondoSeleccionado = document.getElementById("fondoIA").value; // <- CAPTURAMOS EL FONDO
                
                const docRef = await addDoc(collection(db, "tareas_ia"), {
                    estado: "pendiente",
                    comando: comando,
                    fidelidad: nivelFidelidad, 
                    fondo_id: fondoSeleccionado, // <- LO ENVIAMOS A KAGGLE AQUÍ
                    url_imagen: urlOriginal,
                    fecha: new Date()
                });

                // 3. Escuchar la respuesta
                const unsubscribe = onSnapshot(doc(db, "tareas_ia", docRef.id), (documento) => {
                    const datos = documento.data();
                    
                    if (datos.estado === "procesando") {
                        txtEstado.innerText = "⚙️ Kaggle dice: ¡Procesando ahora mismo!";
                        txtEstado.className = "mt-4 text-center font-bold text-blue-400";
                    } 
                    else if (datos.estado === "completado") {
                        txtEstado.innerText = "✅ ¡Listo! Resultado recibido.";
                        txtEstado.className = "mt-4 text-center font-bold text-green-400";
                        imgResultado.src = datos.url_resultado;
                        imgResultado.classList.remove("hidden");
                        
                        btnEnviar.disabled = false;
                        btnEnviar.classList.replace("bg-gray-600", "bg-blue-600");
                        unsubscribe();
                    }
                    else if (datos.estado === "error") {
                        txtEstado.innerText = "❌ Hubo un error en Kaggle.";
                        txtEstado.className = "mt-4 text-center font-bold text-red-500";
                        btnEnviar.disabled = false;
                        btnEnviar.classList.replace("bg-gray-600", "bg-blue-600");
                        unsubscribe();
                    }
                });

            } catch (error) {
                console.error(error);
                txtEstado.innerText = "❌ Error de conexión.";
                btnEnviar.disabled = false;
                btnEnviar.classList.replace("bg-gray-600", "bg-blue-600");
            }
        });
    </script>
</body>
</html>
